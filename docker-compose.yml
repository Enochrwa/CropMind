version: "3.9"

services:
  api:
    build: ./backend
    container_name: cropmind_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models:/app/app/ml/models

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: cropmind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cropmind
      POSTGRES_USER: cropmind
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cropmind_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cropmind_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  celery_worker:
    build: ./backend
    container_name: cropmind_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    depends_on:
      - redis
      - postgres

  celery_beat:
    build: ./backend
    container_name: cropmind_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: cropmind_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/letsencrypt

volumes:
  postgres_data:
  ollama_data:
  ml_models:
  nginx_certs:
